name: Nightly stats backup
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Export aggregated stats
        run: |
          mkdir -p backups
          curl -s \
            -H "x-api-key: ${{ secrets.ANONYMIZE_API_KEY }}" \
            "${{ secrets.RAILWAY_APP_URL }}/api/game/export/all" \
            -o "backups/stats-$(date +%Y-%m-%d).json" || true

      - name: Commit backup
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add backups/
          git diff --staged --quiet || git commit -m "backup: nightly stats $(date +%Y-%m-%d)"
          git push
